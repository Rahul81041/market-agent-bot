name: Market Agent 24x7

on:
  schedule:
    - cron: '*/5 * * * 1-5'   # Every 5 min during market hours
  workflow_dispatch:           # Manual button trigger

jobs:
  market-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests yfinance pandas schedule

      - name: Run Market Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python autonomous_market_agent.py
        timeout-minutes: 5
